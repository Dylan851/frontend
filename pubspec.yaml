name: animalgo_game
description: AnimalGO - RPG educativo de animales para niños
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  bonfire: ^3.16.1
  flame: ^1.32.0
  shared_preferences: ^2.2.2
  http: ^1.1.0
  dio: ^5.3.0
  provider: ^6.0.0
  flutter_3d_controller: ^2.0.0
  supabase_flutter: ^2.8.0
  flutter_stripe: ^11.5.0
  google_fonts: ^6.2.1
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon/animalgo_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1F4E2A"
  adaptive_icon_foreground: "assets/icon/animalgo_icon.png"
  remove_alpha_ios: false

flutter:
  uses-material-design: true
  assets:
    - assets/images/player/
    - assets/images/tiles/
    - assets/images/trees/
    - assets/images/animals/
    - assets/images/animals_basic/
    - assets/images/items/
    - assets/images/backgrounds/
    - assets/maps/
    - assets/models/
    # Audio de proximidad de animales — añade aquí cuando tengas los sonidos
    # - assets/audio/animals/
